{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mt-5 mb-5">
                <div class="card-header bg-primary text-white">
                    <h2 class="text-center">Update Your Profile</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <!-- Name Field -->
                        <div class="mb-3">
                            <label for="id_name" class="form-label">Name</label>
                            {{ form.name }}
                        </div>
                        <!-- ID Number Field -->
                        <div class="mb-3">
                            <label for="id_id_number" class="form-label">ID Number</label>
                            {{ form.id_number }}
                        </div>
                        <!-- NCPWD Number Field -->
                        <div class="mb-3">
                            <label for="id_ncpwd_number" class="form-label">NCPWD Number</label>
                            {{ form.ncpwd_number }}
                        </div>
                        <!-- Phone Number Field -->
                        <div class="mb-3">
                            <label for="id_phone_number" class="form-label">Phone Number</label>
                            {{ form.phone_number }}
                        </div>
                        <!-- County Field -->
                        <div class="mb-3">
                            <label for="id_county" class="form-label">County</label>
                            {{ form.county }}
                        </div>
                        <!-- Subcounty Field -->
                        <div class="mb-3">
                            <label for="id_subcounty" class="form-label">Subcounty</label>
                            {{ form.subcounty }}
                        </div>
                        <!-- Ward Field -->
                        <div class="mb-3">
                            <label for="id_ward" class="form-label">Ward</label>
                            {{ form.ward }}
                        </div>
                        <!-- Level of Education Field -->
                        <div class="mb-3">
                            <label for="id_level_of_education" class="form-label">Level of Education</label>
                            {{ form.level_of_education }}
                        </div>
                        <!-- Skills Field -->
                        <div class="mb-3">
                            <label for="id_skills" class="form-label">Skills</label>
                            {{ form.skills }}
                        </div>
                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Update Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
